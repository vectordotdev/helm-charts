name: Require active release freeze
description: Require an active master and develop freeze, bot direct-push access, enforced required checks, and force-push protection.
inputs:
  app-id:
    description: ID of the vectordotdev-bot GitHub App.
    required: true
  app-private-key:
    description: Private key of the vectordotdev-bot GitHub App.
    required: true
  freeze-ruleset-id:
    description: Repository variable RELEASE_FREEZE_RULESET_ID (the vars context is unavailable in composite actions).
    required: true
  bot-bypass-ruleset-ids:
    description: Repository variable RELEASE_FREEZE_BOT_BYPASS, comma-separated ruleset IDs (the vars context is unavailable in composite actions).
    required: true
runs:
  using: composite
  steps:
    # Query as the bot: GITHUB_TOKEN cannot prove the bot's bypass permissions.
    - name: Create bot token for freeze checks
      id: bot-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-administration: read

    # This is a best-effort guard and remains susceptible to TOCTOU changes after the check.
    # Keep the freeze and temporary bot bypasses until Post Release finishes.
    - name: Check release freeze and bot permissions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BOT_APP_SLUG: ${{ steps.bot-token.outputs.app-slug }}
        RELEASE_FREEZE_RULESET_ID: ${{ inputs.freeze-ruleset-id }}
        RELEASE_FREEZE_BOT_BYPASS: ${{ inputs.bot-bypass-ruleset-ids }}
      with:
        github-token: ${{ steps.bot-token.outputs.token }}
        script: |
          if (process.env.BOT_APP_SLUG !== "vectordotdev-bot") {
            core.setFailed("Release freeze checks require the vectordotdev-bot GitHub App.");
            return;
          }
          const { RELEASE_BRANCHES, readRulesetIds, restrictsReleaseUpdates, canManageReleaseBypass } =
            require("./.github/actions/require-release-freeze/rulesets.js");
          const { freezeId, bypassIds } = readRulesetIds(process.env);
          const { data: repository } = await github.request("GET /repos/{owner}/{repo}", context.repo);

          // Let GitHub resolve branch patterns and inherited rulesets. An active
          // freeze targeting other branches does not protect the release branches.
          const branches = await Promise.all(RELEASE_BRANCHES.map(async (branch) => ({
            branch,
            rules: await github.paginate(
              "GET /repos/{owner}/{repo}/rules/branches/{branch}",
              { ...context.repo, branch },
            ),
          })));
          const allRules = branches.flatMap(({ rules }) => rules);
          const details = await Promise.all(
            [...new Set([freezeId, ...bypassIds, ...allRules.map((rule) => rule.ruleset_id)])].map(async (id) => {
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/rulesets/{ruleset_id}",
                { ...context.repo, ruleset_id: id, includes_parents: true },
              );
              return data;
            }),
          );
          const byId = new Map(details.map((ruleset) => [ruleset.id, ruleset]));
          const freeze = byId.get(freezeId);
          if (freeze.enforcement !== "active" || !restrictsReleaseUpdates(freeze, repository.default_branch)) {
            core.setFailed(`Configured freeze ruleset ${freezeId} must actively restrict updates to ${RELEASE_BRANCHES.join(" and ")}.`);
            return;
          }
          const modes = new Set(["always", "exempt", "pull_requests_only", "never"]);
          for (const ruleset of details) {
            if (!modes.has(ruleset.current_user_can_bypass)) {
              core.setFailed(`Cannot determine vectordotdev-bot bypass access for ${ruleset.name}.`);
              return;
            }
          }
          const canPush = (ruleset) => ["always", "exempt"].includes(ruleset.current_user_can_bypass);
          for (const id of [freezeId, ...bypassIds]) {
            if (!canPush(byId.get(id))) {
              core.setFailed(`Configured ruleset ${id} must permit direct pushes by vectordotdev-bot.`);
              return;
            }
          }
          for (const id of bypassIds) {
            if (!canManageReleaseBypass(byId.get(id), repository.default_branch) ||
                !allRules.some((rule) => rule.ruleset_id === id)) {
              core.setFailed(`Configured bypass ruleset ${id} must be active and contain only release branch pull_request and update rules.`);
              return;
            }
          }

          // These rules permit an ordinary, single-parent update.
          const pushSafe = new Set(["creation", "deletion", "non_fast_forward", "required_linear_history"]);
          for (const { branch, rules } of branches) {
            if (!rules.some((rule) => rule.ruleset_id === freezeId && rule.type === "update")) {
              core.setFailed(`Release freeze ${freezeId} must restrict updates to ${branch}.`);
            }
            // Direct pushes skip pull requests, so GitHub must still enforce the
            // required checks: the bot pushes only commits that passed them.
            const checks = rules.filter((rule) => rule.type === "required_status_checks");
            if (checks.length === 0) {
              core.setFailed(`${branch} must have a required_status_checks rule.`);
            }
            for (const rule of checks) {
              const ruleset = byId.get(rule.ruleset_id);
              if (canPush(ruleset)) {
                core.setFailed(`vectordotdev-bot must not bypass the required status checks in ${ruleset.name} on ${branch}.`);
              }
            }
            // All other effective rules require a direct-push bypass, not a PR-only bypass.
            for (const ruleset of details) {
              const blocking = rules.filter((rule) => rule.ruleset_id === ruleset.id &&
                rule.type !== "required_status_checks" && !pushSafe.has(rule.type));
              if (blocking.length > 0 && !canPush(ruleset)) {
                core.setFailed(
                  `vectordotdev-bot needs an always bypass for ${ruleset.name} on ${branch} during the release freeze (${blocking.map((rule) => rule.type).join(", ")}). A pull-request-only bypass does not allow direct pushes.`,
                );
              }
            }
            // Bypassing pull request and update rules must not also permit rewriting or deleting the branch.
            for (const type of ["non_fast_forward", "deletion"]) {
              if (!rules.some((rule) => rule.type === type && !canPush(byId.get(rule.ruleset_id)))) {
                core.setFailed(`${branch} must retain an active ${type} rule that vectordotdev-bot cannot bypass.`);
              }
            }
          }
