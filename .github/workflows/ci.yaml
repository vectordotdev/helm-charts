# Credit: https://github.com/DataDog/helm-charts/blob/main/.github/workflows/ci.yaml
name: Lint and Test Charts

on:
  pull_request:
  # Release automation pushes to master and develop directly. It pushes each
  # commit here first, so the required checks pass on that exact commit.
  push:
    branches:
      - "releasing/**"

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Test rendered image references
        run: python3 .github/test-image-references.py
      - name: Copy example values into ci/
        run: cp charts/vector/examples/*-values.yaml charts/vector/ci/
      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Helm Docs
        uses: envoy/install-helm-docs@05313083ef2cfaea27c4c3d7cb725242d22ea88b # v1.0.0
        with:
          version: 1.11.0
      - name: Run helm-docs
        run: |
          helm-docs
          git diff --exit-code

  kubeval-chart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # When changing versions here, check that the version exists at: https://github.com/yannh/kubernetes-json-schema and https://hub.docker.com/r/kindest/node/tags
        # Aim to match https://github.com/vectordotdev/vector/blob/master/.github/workflows/k8s_e2e.yml as close as possible
        k8s:
          - v1.35.0
          - v1.34.0
          - v1.33.0
          - v1.32.0
          - v1.30.0
          - v1.28.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Add vector helm repo
        run: |
          helm repo add vector https://helm.vector.dev
          helm repo update
      - name: Run kubeval
        env:
          KUBERNETES_VERSION: ${{ matrix.k8s }}
        run: .github/kubeval.sh

  install-chart:
    runs-on: ubuntu-latest
    needs:
      - lint-chart
      - kubeval-chart
    strategy:
      matrix:
        # When changing versions here, check that the version exists at: https://github.com/yannh/kubernetes-json-schema and https://hub.docker.com/r/kindest/node/tags
        # Aim to match https://github.com/vectordotdev/vector/blob/master/.github/workflows/k8s_e2e.yml as close as possible
        k8s:
          - v1.35.0
          - v1.34.0
          - v1.33.0
          - v1.32.0
          - v1.30.0
          - v1.28.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create kind ${{ matrix.k8s }}
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          node_image: kindest/node:${{ matrix.k8s }}
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Copy example values into ci/
        run: cp charts/vector/examples/*-values.yaml charts/vector/ci/
      - name: Run chart-testing (install)
        run: ct install --config .github/ct.yaml --upgrade

  # `ct install --upgrade` compares against a git revision and skips whenever
  # the minor version changes, which is every PR during a release cycle. This
  # job upgrades a release in place, the way users upgrade, from:
  # - release: the latest published chart.
  # - base: the chart on the PR's base branch, so that a change marked breaking
  #   that is not released yet doesn't hide the PR's own upgrade failures.
  upgrade-chart:
    runs-on: ubuntu-latest
    needs:
      - lint-chart
      - kubeval-chart
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          node_image: kindest/node:v1.35.0
      - name: Upgrade in place
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pattern='^[a-z]+(\([^)]*\))?!:'

          # Read the title at run time so that a re-run sees an edited title.
          title=""
          if [ -n "$PR_NUMBER" ]; then
            title=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title) \
              || { echo "::error::Could not read the title of PR #${PR_NUMBER}"; exit 1; }
          fi
          pr_breaking=false
          if grep -Eq "$pattern" <<< "$title"; then
            pr_breaking=true
          fi

          # Installs the baseline chart with each values file and upgrades it in
          # place to this chart. Every pair runs. A failed install always fails
          # the job, and a failed upgrade fails it unless the baseline is exempt.
          status=0
          upgrade_from() {
            local from=$1 chart=$2 exempt=$3 values name
            for values in charts/vector/ci/*-default-values.yaml; do
              name="${from}-$(basename "$values" -default-values.yaml)"
              echo "::group::${name}"
              if ! helm install "$name" "$chart" --values "$values" \
                --namespace "$name" --create-namespace --wait --timeout 300s; then
                echo "::error::${name}: installing the ${from} chart failed"
                status=1
              elif ! helm upgrade "$name" charts/vector --values "$values" \
                --namespace "$name" --wait --timeout 300s; then
                if [ "$exempt" = true ]; then
                  echo "::warning::${name}: the upgrade failed, which a change marked breaking allows"
                else
                  echo "::error::${name}: the upgrade failed"
                  status=1
                fi
              fi
              echo "::endgroup::"
            done
          }

          # The latest published chart. A change marked breaking in this PR or
          # since that release may fail the upgrade from it.
          helm repo add vector https://helm.vector.dev
          version=$(helm search repo vector/vector --output json | jq -r '.[0].version')
          git rev-parse --verify --quiet "vector-${version}^{commit}" > /dev/null \
            || { echo "::error::Tag vector-${version} not found"; exit 1; }
          helm pull vector/vector --version "$version" --untar --untardir "$RUNNER_TEMP/release"
          release_breaking=$pr_breaking
          if git log --format=%s "vector-${version}..HEAD" | grep -Eq "$pattern"; then
            release_breaking=true
          fi
          upgrade_from release "$RUNNER_TEMP/release/vector" "$release_breaking"

          # The chart on the PR's base branch. Only this PR's own breaking mark
          # may fail the upgrade from it, so an unreleased breaking change
          # doesn't hide this PR's failures. HEAD is the PR's merge commit, and
          # its first parent is the base. Pushes to `releasing/**` have no PR.
          if [ -n "$PR_NUMBER" ]; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            upgrade_from base "$RUNNER_TEMP/base/charts/vector" "$pr_breaking"
          fi
          exit "$status"

  pr-validated:
    name: pr-validated
    runs-on: ubuntu-latest
    # Without always(), a failed dependency skips this job, and a skipped
    # required check counts as passing.
    if: ${{ always() }}
    needs:
      - install-chart
      - upgrade-chart
      - lint-docs
    steps:
      - name: validate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $(paste -sd ' ' <<< "$failed")"
            exit 1
          fi
          echo "PR OK"
