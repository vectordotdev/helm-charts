# Credit: https://github.com/DataDog/helm-charts/blob/main/.github/workflows/ci.yaml
name: Lint and Test Charts

on:
  pull_request:
  # Release automation pushes to master and develop directly. It pushes each
  # commit here first, so the required checks pass on that exact commit.
  push:
    branches:
      - "releasing/**"

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Test rendered image references
        run: python3 .github/test-image-references.py
      - name: Copy example values into ci/
        run: cp charts/vector/examples/*-values.yaml charts/vector/ci/
      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Helm Docs
        uses: envoy/install-helm-docs@05313083ef2cfaea27c4c3d7cb725242d22ea88b # v1.0.0
        with:
          version: 1.11.0
      - name: Run helm-docs
        run: |
          helm-docs
          git diff --exit-code

  kubeval-chart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # When changing versions here, check that the version exists at: https://github.com/yannh/kubernetes-json-schema and https://hub.docker.com/r/kindest/node/tags
        # Aim to match https://github.com/vectordotdev/vector/blob/master/.github/workflows/k8s_e2e.yml as close as possible
        k8s:
          - v1.35.0
          - v1.34.0
          - v1.33.0
          - v1.32.0
          - v1.30.0
          - v1.28.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Add vector helm repo
        run: |
          helm repo add vector https://helm.vector.dev
          helm repo update
      - name: Run kubeval
        env:
          KUBERNETES_VERSION: ${{ matrix.k8s }}
        run: .github/kubeval.sh

  install-chart:
    runs-on: ubuntu-latest
    needs:
      - lint-chart
      - kubeval-chart
    strategy:
      matrix:
        # When changing versions here, check that the version exists at: https://github.com/yannh/kubernetes-json-schema and https://hub.docker.com/r/kindest/node/tags
        # Aim to match https://github.com/vectordotdev/vector/blob/master/.github/workflows/k8s_e2e.yml as close as possible
        k8s:
          - v1.35.0
          - v1.34.0
          - v1.33.0
          - v1.32.0
          - v1.30.0
          - v1.28.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create kind ${{ matrix.k8s }}
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          node_image: kindest/node:${{ matrix.k8s }}
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Copy example values into ci/
        run: cp charts/vector/examples/*-values.yaml charts/vector/ci/
      - name: Run chart-testing (install)
        run: ct install --config .github/ct.yaml --upgrade

  # `ct install --upgrade` compares against a git revision and skips whenever
  # the minor version changes, which is every PR during a release cycle. This
  # job upgrades a release of the latest published chart in place, the way
  # users upgrade.
  upgrade-from-release:
    runs-on: ubuntu-latest
    needs:
      - lint-chart
      - kubeval-chart
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          node_image: kindest/node:v1.35.0
      - name: Find the latest published chart
        id: latest
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          helm repo add vector https://helm.vector.dev
          version=$(helm search repo vector/vector --output json | jq -r '.[0].version')
          git rev-parse --verify --quiet "vector-${version}^{commit}" > /dev/null \
            || { echo "::error::Tag vector-${version} not found"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # A change marked breaking (`type(scope)!:`) in this PR or since the
          # latest release is expected to fail the upgrade.
          breaking=false
          pattern='^[a-z]+(\([^)]*\))?!:'
          if grep -Eq "$pattern" <<< "$PR_TITLE" \
            || git log --format=%s "vector-${version}..HEAD" | grep -Eq "$pattern"; then
            breaking=true
            echo "::warning::Breaking change since ${version}: the upgrade test reports failures without blocking."
          fi
          echo "breaking=${breaking}" >> "$GITHUB_OUTPUT"
      - name: Upgrade in place from ${{ steps.latest.outputs.version }}
        continue-on-error: ${{ steps.latest.outputs.breaking == 'true' }}
        env:
          FROM_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          for values in charts/vector/ci/*-default-values.yaml; do
            release="upgrade-$(basename "$values" -default-values.yaml)"
            helm install "$release" vector/vector --version "$FROM_VERSION" --values "$values" \
              --namespace "$release" --create-namespace --wait --timeout 300s
            helm upgrade "$release" charts/vector --values "$values" \
              --namespace "$release" --wait --timeout 300s
          done

  pr-validated:
    name: pr-validated
    runs-on: ubuntu-latest
    needs:
      - install-chart
      - upgrade-from-release
      - lint-docs
    steps:
      - name: validate
        run: echo "PR OK"
