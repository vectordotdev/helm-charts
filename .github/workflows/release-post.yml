name: Post Release

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git ref (branch or commit SHA) to sync to master, e.g. release-0.56.0'
        required: true
        type: string

jobs:
  sync-to-master:
    # Only run when a release-* branch is merged into develop, or manually triggered
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      chart_version: ${{ steps.read-version.outputs.chart_version }}

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VECTORDOTDEV_BOT_APP_ID }}
          private-key: ${{ secrets.VECTORDOTDEV_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "vectordotdev-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Read chart version
        id: read-version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const chart = fs.readFileSync('charts/vector/Chart.yaml', 'utf8');
            const version = chart.match(/^version: "(\d+\.\d+\.\d+)"\r?$/m)?.[1];
            if (!version) {
              throw new Error('Chart.yaml must contain a valid chart version (major.minor.patch)');
            }
            core.setOutput('chart_version', version);

      - name: Push sync branch
        env:
          CHART_VERSION: ${{ steps.read-version.outputs.chart_version }}
        run: |
          git checkout -b "release-sync/${CHART_VERSION}"
          git push origin "release-sync/${CHART_VERSION}" --force-with-lease

      - name: Create sync PR
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHART_VERSION: ${{ steps.read-version.outputs.chart_version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.CHART_VERSION;
            const branch = `release-sync/${version}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, head: `${owner}:${branch}`, base: 'master', state: 'all',
            });
            const matching = pulls.filter(pr =>
              pr.head.ref === branch && pr.head.repo?.owner.login === owner
            );
            let pr = matching.find(pr => pr.state === 'open')
              ?? matching.find(pr => pr.merged_at)
              ?? matching[0];

            if (pr?.merged_at) {
              core.info(`Sync PR already merged: ${pr.html_url}`);
              return;
            }
            if (pr?.state === 'closed') {
              throw new Error(`Sync PR was closed without merging: ${pr.html_url}`);
            }
            if (!pr) {
              ({ data: pr } = await github.rest.pulls.create({
                owner, repo, base: 'master', head: branch,
                title: `chore(releasing): Merge develop into master for ${version}`,
                body: `Post release: sync master with the release changes from develop for ${version}.`,
              }));
            }
            core.setOutput('number', pr.number);

      - name: Merge or enable auto-merge
        if: steps.pull-request.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          MERGE_METHOD: MERGE
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: &merge-pr |
            async function readPullRequest() {
              const { repository } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id url state mergeStateStatus isInMergeQueue isMergeQueueEnabled
                      autoMergeRequest { enabledAt }
                    }
                  }
                }
              `, { ...context.repo, number: Number(process.env.PR_NUMBER) });
              return repository.pullRequest;
            }

            function alreadyHandled(pr) {
              if (pr.state === 'MERGED') {
                core.info(`PR already merged: ${pr.url}`);
                return true;
              }
              if (pr.state === 'CLOSED') {
                throw new Error(`PR was closed without merging: ${pr.url}`);
              }
              if (pr.autoMergeRequest || pr.isInMergeQueue) {
                core.info(`PR already scheduled to merge: ${pr.url}`);
                return true;
              }
              return false;
            }

            const pr = await readPullRequest();
            if (alreadyHandled(pr)) return;

            // Like gh pr merge --auto, merge now if checks permit it.
            const autoMerge = pr.isMergeQueueEnabled
              || !['CLEAN', 'HAS_HOOKS', 'UNSTABLE'].includes(pr.mergeStateStatus);
            const mutation = autoMerge ? 'enablePullRequestAutoMerge' : 'mergePullRequest';
            const inputType = autoMerge ? 'EnablePullRequestAutoMergeInput' : 'MergePullRequestInput';
            try {
              await github.graphql(`
                mutation($input: ${inputType}!) {
                  ${mutation}(input: $input) { pullRequest { url } }
                }
              `, { input: { pullRequestId: pr.id, mergeMethod: process.env.MERGE_METHOD } });
              core.info(`${autoMerge ? 'Auto-merge enabled' : 'PR merged'}: ${pr.url}`);
            } catch (error) {
              // Another run may have merged the PR or enabled auto-merge.
              if (!alreadyHandled(await readPullRequest())) throw error;
            }

  bump-version:
    needs: [sync-to-master]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VECTORDOTDEV_BOT_APP_ID }}
          private-key: ${{ secrets.VECTORDOTDEV_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "vectordotdev-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install helm-docs
        uses: envoy/install-helm-docs@05313083ef2cfaea27c4c3d7cb725242d22ea88b # v1.0.0
        with:
          version: 1.11.0

      - name: Read and bump chart version
        id: version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHART_VERSION: ${{ needs.sync-to-master.outputs.chart_version }}
        with:
          script: |
            const current = process.env.CHART_VERSION;
            const [major, minor] = current.split('.');
            core.setOutput('current', current);
            core.setOutput('next', `${major}.${Number(minor) + 1}.0`);

      - name: Create version bump branch
        run: |
          git checkout -b "bump-chart-version-${{ steps.version.outputs.next }}"

      - name: Bump chart version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        with:
          script: |
            const fs = require('node:fs');
            const path = 'charts/vector/Chart.yaml';
            const chart = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, chart.replace(
              `version: "${process.env.CURRENT}"`,
              `version: "${process.env.NEXT}"`,
            ));

      - name: Update Helm docs
        run: helm-docs

      - name: Commit and push
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEXT: ${{ steps.version.outputs.next }}
        with:
          script: |
            const next = process.env.NEXT;
            await exec.exec('git', ['add', '.']);
            const status = await exec.exec('git', ['diff', '--cached', '--quiet'], {
              ignoreReturnCode: true,
            });
            if (status === 0) {
              const fs = require('node:fs');
              const chart = fs.readFileSync('charts/vector/Chart.yaml', 'utf8');
              const actual = chart.match(/^version: "([^"]*)"\r?$/m)?.[1];
              if (actual !== next) {
                throw new Error(`No staged changes but chart version is '${actual}' (expected '${next}')`);
              }
              core.info(`Chart version already at ${next}; nothing to commit`);
              return;
            }
            if (status !== 1) throw new Error(`git diff failed with exit code ${status}`);
            await exec.exec('git', ['commit', '-m', `chore(releasing): Bump chart version to ${next}`]);
            await exec.exec('git', ['push', '-u', 'origin', `bump-chart-version-${next}`, '--force-with-lease']);

      - name: Create version bump PR
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEXT: ${{ steps.version.outputs.next }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const next = process.env.NEXT;
            const branch = `bump-chart-version-${next}`;
            async function findPullRequests(state) {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, head: `${owner}:${branch}`, base: 'develop', state,
              });
              return pulls.filter(pr =>
                pr.head.ref === branch && pr.head.repo?.owner.login === owner
              );
            }

            const merged = (await findPullRequests('closed')).find(pr => pr.merged_at);
            if (merged) {
              core.info(`Bump PR already merged: ${merged.html_url}`);
              return;
            }

            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.create({
                owner, repo, base: 'develop', head: branch,
                title: `chore(releasing): Bump chart version to ${next}`,
                body: 'Post release version bump.',
              }));
            } catch (error) {
              const matching = await findPullRequests('all');
              pr = matching.find(pr => pr.state === 'open')
                ?? matching.find(pr => pr.merged_at)
                ?? matching[0];
              if (!pr) throw error;
              if (pr.merged_at) {
                core.info(`Bump PR already merged: ${pr.html_url}`);
                return;
              }
              if (pr.state === 'closed') {
                throw new Error(`Bump PR was closed without merging: ${pr.html_url}`);
              }
              core.info(`Bump PR already exists: ${pr.html_url}`);
            }
            core.setOutput('number', pr.number);

      - name: Merge or enable auto-merge
        if: steps.pull-request.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          MERGE_METHOD: SQUASH
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: *merge-pr
