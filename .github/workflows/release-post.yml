name: Post Release

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git ref (branch or commit SHA) to sync to master, e.g. release-0.56.0'
        required: true
        type: string

jobs:
  sync-to-master:
    # Only run when a release-* branch is merged into develop, or manually triggered
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      chart_version: ${{ steps.read-version.outputs.chart_version }}

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VECTORDOTDEV_BOT_APP_ID }}
          private-key: ${{ secrets.VECTORDOTDEV_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "vectordotdev-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Read chart version
        id: read-version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const chart = fs.readFileSync('charts/vector/Chart.yaml', 'utf8');
            const version = chart.match(/^version: "(\d+\.\d+\.\d+)"\r?$/m)?.[1];
            if (!version) {
              throw new Error('Chart.yaml must contain a valid chart version (major.minor.patch)');
            }
            core.setOutput('chart_version', version);

      - name: Find sync PR
        id: existing-pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHART_VERSION: ${{ steps.read-version.outputs.chart_version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.CHART_VERSION;
            const branch = `release-sync/${version}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, head: `${owner}:${branch}`, base: 'master', state: 'all',
            });
            const matching = pulls.filter(pr =>
              pr.head.ref === branch && pr.head.repo?.owner.login === owner
            );
            let pr = matching.find(pr => pr.state === 'open')
              ?? matching.find(pr => pr.merged_at)
              ?? matching[0];

            if (pr?.merged_at) {
              core.info(`Sync PR already merged: ${pr.html_url}`);
              return;
            }
            if (pr?.state === 'closed') {
              throw new Error(`Sync PR was closed without merging: ${pr.html_url}`);
            }
            if (pr) {
              // An open PR may predate a newer checked-out ref; use its head SHA
              // as the lease for refreshing the branch.
              core.setOutput('remote_sha', pr.head.sha);
              core.setOutput('number', pr.number);
              core.setOutput('push', 'true');
            } else {
              // A previous run may have pushed the branch but failed to create
              // the PR; record its SHA (empty if absent) as the push lease.
              const remote = await exec.getExecOutput('git', ['ls-remote', '--heads', 'origin', `refs/heads/${branch}`]);
              const remoteSha = remote.stdout.trim().split('\t')[0] ?? '';
              core.setOutput('remote_sha', remoteSha);
              core.setOutput('push', 'true');
              core.setOutput('create', 'true');
            }

      - name: Push sync branch
        if: steps.existing-pr.outputs.push == 'true' || steps.existing-pr.outputs.create == 'true'
        env:
          CHART_VERSION: ${{ steps.read-version.outputs.chart_version }}
          REMOTE_SHA: ${{ steps.existing-pr.outputs.remote_sha }}
        run: |
          BRANCH="release-sync/${CHART_VERSION}"
          # Lease-guarded atomic create-or-update of the (possibly open) sync branch.
          git checkout -B "$BRANCH"
          git push -u origin --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" "$BRANCH"

      - name: Create sync PR
        if: steps.existing-pr.outputs.create == 'true'
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHART_VERSION: ${{ steps.read-version.outputs.chart_version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.CHART_VERSION;
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base: 'master', head: `release-sync/${version}`,
              title: `chore(releasing): Merge develop into master for ${version}`,
              body: `Post release: sync master with the release changes from develop for ${version}.`,
            });
            core.setOutput('number', pr.number);

      - name: Merge or enable auto-merge
        if: steps.existing-pr.outputs.number != '' || steps.pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.existing-pr.outputs.number || steps.pull-request.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --auto --merge

  bump-version:
    needs: [sync-to-master]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VECTORDOTDEV_BOT_APP_ID }}
          private-key: ${{ secrets.VECTORDOTDEV_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "vectordotdev-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Calculate next chart version
        id: version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHART_VERSION: ${{ needs.sync-to-master.outputs.chart_version }}
        with:
          script: |
            const current = process.env.CHART_VERSION;
            const [major, minor] = current.split('.');
            core.setOutput('current', current);
            core.setOutput('next', `${major}.${Number(minor) + 1}.0`);

      - name: Check bump completion and find PR
        id: existing-pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const next = process.env.NEXT;
            const branch = `bump-chart-version-${next}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, head: `${owner}:${branch}`, base: 'develop', state: 'all',
            });
            const matching = pulls.filter(pr =>
              pr.head.ref === branch && pr.head.repo?.owner.login === owner
            );
            const merged = matching.find(pr => pr.merged_at);
            if (merged) {
              core.info(`Bump PR already merged: ${merged.html_url}`);
              return;
            }

            const fs = require('node:fs');
            const chart = fs.readFileSync('charts/vector/Chart.yaml', 'utf8');
            const actual = chart.match(/^version: "(\d+\.\d+\.\d+)"\r?$/m)?.[1];
            if (!actual) throw new Error('Chart.yaml must contain a valid chart version');
            const parts = actual.split('.').map(Number);
            const target = next.split('.').map(Number);
            const difference = parts.map((part, index) => part - target[index]).find(value => value !== 0) ?? 0;
            if (difference >= 0) {
              core.info(`Chart version ${actual} already includes bump to ${next}`);
              return;
            }

            const pr = matching.find(pr => pr.state === 'open') ?? matching[0];
            if (pr?.state === 'closed') {
              throw new Error(`Bump PR was closed without merging: ${pr.html_url}`);
            }
            if (pr) {
              core.setOutput('number', pr.number);
              return;
            }
            if (actual !== process.env.CURRENT) {
              throw new Error(`Chart version is '${actual}' (expected '${process.env.CURRENT}')`);
            }
            // An orphaned branch may exist if a previous run pushed but failed to
            // create the PR; record its SHA (empty if absent) as the push lease.
            const remote = await exec.getExecOutput('git', ['ls-remote', '--heads', 'origin', `refs/heads/${branch}`]);
            const remoteSha = remote.stdout.trim().split('\t')[0] ?? '';
            core.setOutput('remote_sha', remoteSha);
            core.setOutput('create', 'true');

      - name: Install helm-docs
        if: steps.existing-pr.outputs.create == 'true'
        uses: envoy/install-helm-docs@05313083ef2cfaea27c4c3d7cb725242d22ea88b # v1.0.0
        with:
          version: 1.11.0

      - name: Create version bump branch
        if: steps.existing-pr.outputs.create == 'true'
        run: |
          git checkout -b "bump-chart-version-${{ steps.version.outputs.next }}"

      - name: Bump chart version
        if: steps.existing-pr.outputs.create == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        with:
          script: |
            const fs = require('node:fs');
            const path = 'charts/vector/Chart.yaml';
            const chart = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, chart.replace(
              `version: "${process.env.CURRENT}"`,
              `version: "${process.env.NEXT}"`,
            ));

      - name: Update Helm docs
        if: steps.existing-pr.outputs.create == 'true'
        run: helm-docs

      - name: Commit and push
        if: steps.existing-pr.outputs.create == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEXT: ${{ steps.version.outputs.next }}
          REMOTE_SHA: ${{ steps.existing-pr.outputs.remote_sha }}
        with:
          script: |
            const next = process.env.NEXT;
            await exec.exec('git', ['add', '.']);
            await exec.exec('git', ['commit', '-m', `chore(releasing): Bump chart version to ${next}`]);
            // Lease-guarded atomic create-or-update of the (possibly orphaned) branch.
            const branch = `bump-chart-version-${next}`;
            const lease = `refs/heads/${branch}:${process.env.REMOTE_SHA ?? ''}`;
            await exec.exec('git', ['push', '-u', 'origin', `--force-with-lease=${lease}`, branch]);

      - name: Create version bump PR
        if: steps.existing-pr.outputs.create == 'true'
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEXT: ${{ steps.version.outputs.next }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const next = process.env.NEXT;
            const branch = `bump-chart-version-${next}`;
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base: 'develop', head: branch,
              title: `chore(releasing): Bump chart version to ${next}`,
              body: 'Post release version bump.',
            });
            core.setOutput('number', pr.number);

      - name: Merge or enable auto-merge
        if: steps.existing-pr.outputs.number != '' || steps.pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.existing-pr.outputs.number || steps.pull-request.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
